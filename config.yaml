directory: "~/Library/Application Support/SpindleBot/Pending"
library: ~/.config/beets/library.db

import:
  write: yes
  move: yes
  log: ~/.config/beets/import.log
  quiet: yes
  quiet_fallback: asis
  group_albums: yes
  ignore: ['.*', '*.beets', '*.initfrag', '*.movpkg', 'iTunes']

plugins:
  - musicbrainz
  - fetchart
  - embedart
  - lyrics
  - scrub
  - inline

paths:
  # Single disc:  Artist/Album/NN. Title.flac
  # Multi disc:   Artist/Album [Disk N]/NN. Title.flac
  # album_dir: optional per-album directory-name override, for albums whose real
  # name sanitizes into something unreadable (e.g. '/\/\ /\ Y /\' -> '____ __ Y __').
  # Set it on the ITEMS, not the album (%ifdef checks the item's own fields):
  #   beet modify album_dir='MAYA' mb_albumid:<id> && beet move
  # Unset for almost every album, in which case $album is used as before. Preferred
  # over retagging $album, which mbsync would revert on the next metadata sync.
  default: $albumartist/%if{$multidisc,%ifdef{album_dir,,$album} [Disk $disc],%ifdef{album_dir,,$album}}/$track. $title

inline:
  # Computed dynamically from disctotal (not cached). Single-disc rips get disctotal
  # patched to 1 in the DB by music-import.sh after beet import, so this correctly
  # returns "" for them even when MusicBrainz said disctotal > 1.
  multidisc: '"1" if int(disctotal or 0) > 1 else ""'

# Allow periods in filenames (for artists like M.I.A.)
replace:
  '[\\/]': _
  '^\.': _
  '[\x00-\x1f]': _
  '[<>:"\?\*\|]': _
  '\.$': ''
  '\s+$': ''

fetchart:
  auto: yes
  sources: coverart musicbrainz itunes amazon filesystem

embedart:
  auto: yes

lyrics:
  auto: yes
  sources: genius musixmatch tekstowo
  # NOTE: Move genius_api_key to ~/.config/spindlebot/secrets.toml [genius] section.
  # This key is only used by the beets lyrics plugin (auto-fetch during import).
  genius_api_key: Jqv2DDIfn3b97zcp7V7Pvh6bb6bK39aBSfhAo09DWlpFQyWEIQ8KmbFU6MB5tOCc
  fallback: ""

scrub:
  auto: yes

musicbrainz:
  searchlimit: 10
  use_mbids: yes
