# GitHub CLI rules for the music-pipeline project.
# gh pr create and PR comments require explicit permission.

[[bash.rules]]
command = "gh"
args = "pr create{, **}"
decision = "ask"
reason = "Confirm before creating PR — approve in the UI to proceed"

[[bash.rules]]
command = "gh"
args = "pr comment{, **}"
decision = "ask"
reason = "Confirm before adding PR comment — approve in the UI to proceed"

[[bash.rules]]
command = "gh"
decision = "allow"

# Allow spindlebot CLI via full-path python (used by this project's shell scripts and Claude).
# The global config covers bare `python3`, but not /opt/homebrew/bin/python3.
[[bash.rules]]
command = "/opt/homebrew/bin/python3"
args = "-m spindlebot{, **}"
decision = "allow"
