# GitHub CLI rules for the music-pipeline project.
# gh pr create and PR comments require explicit permission.

[[bash.rules]]
command = "gh"
args = "pr create{, **}"
decision = "deny"
reason = "Do not create PRs without explicit permission"

[[bash.rules]]
command = "gh"
args = "pr comment{, **}"
decision = "deny"
reason = "Do not add PR comments without explicit permission"

[[bash.rules]]
command = "gh"
decision = "allow"
