name: CI

on:
  push:
  pull_request:

jobs:
  # ── Python tests ─────────────────────────────────────────────────────────────
  python:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor the code claims to support (StrEnum, tomllib); 3.14
        # is what the dev machine actually runs. Testing only one of them lets
        # the other rot — a 3.12+ f-string landed and CI caught it only after
        # push, which is the failure this matrix exists to prevent.
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest tests/ -v --ignore=tests/shell

  # ── Shell linting + bats ─────────────────────────────────────────────────────
  shell:
    name: Shell lint + tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck and bats
        run: sudo apt-get install -y shellcheck bats

      # Every .sh in the repo, not a hand-maintained list — "shellcheck clean on
      # all .sh files" is a stated non-negotiable, so CI should be what enforces
      # it rather than a subset that silently drifts as scripts are added.
      - name: shellcheck
        run: shellcheck ./*.sh

      - name: bats
        run: bats tests/shell/
