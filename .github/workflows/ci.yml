name: CI

on:
  push:
  pull_request:

jobs:
  # ── Python tests ─────────────────────────────────────────────────────────────
  python:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest tests/ -v --ignore=tests/shell

  # ── Shell linting + bats ─────────────────────────────────────────────────────
  shell:
    name: Shell lint + tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck and bats
        run: sudo apt-get install -y shellcheck bats

      - name: shellcheck
        run: shellcheck music-import.sh music-sync.sh music-notify.sh

      - name: bats
        run: bats tests/shell/
